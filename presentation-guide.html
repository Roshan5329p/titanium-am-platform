<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titanium AM Platform - Presentation & Architecture Guide</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .action-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      margin-bottom: 24px;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
    }
    .btn-secondary:hover { background: #30363d; }
    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0; }
      .container { border: none !important; box-shadow: none !important; padding: 0 !important; background: #fff !important; }
      .action-bar { display: none !important; }
      .markdown-body { color: #24292f !important; }
      .markdown-body table tr { background-color: #fff !important; }
      .markdown-body pre { background-color: #f6f8fa !important; color: #24292f !important; border: 1px solid #d0d7de !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="action-bar">
      <div>
        <strong style="color: #58a6ff;">Titanium AM Platform</strong> &bull; Presentation & Architecture Guide
      </div>
      <div style="display: flex; gap: 10px;">
        <a class="btn btn-secondary" href="./Titanium_AM_Platform_Presentation_Guide.md" download="Titanium_AM_Platform_Presentation_Guide.md">
          📥 Download Markdown (.md)
        </a>
        <button class="btn" onclick="window.print()">
          🖨️ Print / Save as PDF
        </button>
      </div>
    </div>
    <div id="content" class="markdown-body">Loading guide...</div>
  </div>

  <script>
    fetch('./Titanium_AM_Platform_Presentation_Guide.md')
      .then(res => res.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color:red;">Failed to load markdown. Please open Titanium_AM_Platform_Presentation_Guide.md directly.</p>';
      });
  </script>
</body>
</html>
